[package]
name = "topo-sonata"
version = "0.1.0"
edition = "2021"
description = "Musical compositions as simplicial complexes — persistent homology detects harmonic holes, genre classification via Betti numbers"
license = "MIT"
repository = "https://github.com/SuperInstance/topo-sonata"
keywords = ["music", "topology", "homology", "betti", "harmonic"]
categories = ["mathematics", "algorithms"]

[dependencies]
serde = { version = "1", features = ["derive"] }
